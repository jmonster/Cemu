name: Retire superseded Cemu controller build
on:
  push:
    branches: [qa/controller-final-review]
    paths: [.github/workflows/retire-controller-review-build.yml]
permissions:
  actions: write
  pull-requests: read
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only the obsolete build after verifying PR and revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          root = 'https://api.github.com/repos/jmonster/Cemu'
          def request(path, method='GET'):
              req = urllib.request.Request(root + path, method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = response.read()
                  return json.loads(data) if data else None
          pr = request('/pulls/1')
          assert pr['state'] == 'open' and pr['head']['sha'] == '2d845d64bb96ee0f0e06ed543d56e5415e61a939'
          run = request('/actions/runs/35292056646')
          assert run['name'] == 'Build check' and run['event'] == 'pull_request'
          assert run['head_branch'] == 'feature/native-switch2kit'
          assert run['head_sha'] == '8359abeb0d1be8bc99196cda0a2219144ce3b164'
          assert any(p['number'] == 1 for p in run['pull_requests'])
          if run['status'] != 'completed':
              request('/actions/runs/35292056646/cancel', 'POST')
              print('Cancelled only the superseded Cemu PR 1 build; current-head and unrelated runs retained.')
          else:
              print('Superseded build already complete; nothing cancelled.')
          PY
