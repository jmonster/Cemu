name: Qualify native Switch2Kit package
# Dedicated qualification branch only: one bounded Linux run of reviewed source.
# No main/PR trigger or Actions permission changes.
on:
  push:
    branches: [qualification/cemu-native-linux]
    paths: [.github/workflows/qualify-switch2kit.yml]
  workflow_dispatch:
    inputs:
      platform:
        description: Native target to build and check (no Bluetooth/gameplay test)
        type: choice
        required: true
        default: linux-x64
        options:
          - linux-x64
          - windows-x64
          - macos-arm64
          - macos-x64
permissions:
  contents: read
concurrency:
  group: qualify-switch2kit-${{ github.ref }}-${{ (inputs.platform || 'linux-x64') }}
  cancel-in-progress: true
env:
  S2K_BUILD_JOBS: '3'
  VCPKG_MAX_CONCURRENCY: '3'
  # No package-registry writes or access tokens; each run has a local cache only.
  VCPKG_BINARY_SOURCES: clear
  VCPKG_DISABLE_METRICS: '1'
jobs:
  linux:
    if: (inputs.platform || 'linux-x64') == 'linux-x64'
    runs-on: ubuntu-24.04
    container: swift:6.2.1-noble
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c592f77c884d86c9c4b4f83e1a00c25a2186ac1
          persist-credentials: false
          submodules: recursive
      - name: Install native dependencies and pinned build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential python3 python3-venv pkg-config \
            curl zip unzip tar zstd nasm autoconf automake libtool libtool-bin gettext \
            freeglut3-dev libgcrypt20-dev libglm-dev libgtk-3-dev libpulse-dev libsecret-1-dev \
            libsystemd-dev libudev-dev libbluetooth-dev libusb-1.0-0-dev \
            libgl1-mesa-dev libglu1-mesa-dev libx11-xcb-dev libwayland-dev wayland-protocols extra-cmake-modules
          python3 -m venv "$RUNNER_TEMP/build-tools"
          "$RUNNER_TEMP/build-tools/bin/pip" install cmake==3.31.6 ninja==1.11.1.3
          echo "$RUNNER_TEMP/build-tools/bin" >> "$GITHUB_PATH"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check qualifier regressions before the expensive build
        run: |
          python3 tests/switch2kit/test_qualify_package.py
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/switch2kit/smoke.cpp -o "$RUNNER_TEMP/cemu-smoke"
          timeout 10s "$RUNNER_TEMP/cemu-smoke"
      - name: Build the pinned controller-enabled application
        run: |
          mkdir -p qualification
          swift --version | tee qualification/toolchain.txt
          bash scripts/build-switch2kit.sh 2>&1 | tee qualification/build.log
      - name: Check extracted package and isolated loader
        run: python3 tests/switch2kit/qualify-package.py
      - name: Preserve diagnostics (not a release package)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cemu-native-${{ (inputs.platform || 'linux-x64') }}
          path: |
            qualification/
            build-switch2kit/CMakeCache.txt
            build-switch2kit/CMakeFiles/CMakeConfigureLog.yaml
            build-switch2kit/vcpkg-manifest-install.log
          if-no-files-found: warn
          retention-days: 3
  macos:
    if: (inputs.platform || 'linux-x64') == 'macos-arm64' || (inputs.platform || 'linux-x64') == 'macos-x64'
    runs-on: ${{ (inputs.platform || 'linux-x64') == 'macos-arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c592f77c884d86c9c4b4f83e1a00c25a2186ac1
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - name: Install native dependencies and pinned build tools
        run: |
          test -d "$DEVELOPER_DIR"
          brew install nasm automake libtool
          python -m pip install cmake==3.31.6 ninja==1.11.1.3
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/MoltenVK.tar" \
            https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.1/MoltenVK-macos-privateapi.tar
          tar xf "$RUNNER_TEMP/MoltenVK.tar" -C "$RUNNER_TEMP"
          sudo mkdir -p /usr/local/lib
          sudo cp "$RUNNER_TEMP/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib" /usr/local/lib/
      - name: Build the pinned controller-enabled application
        run: |
          mkdir -p qualification
          { sw_vers; uname -m; xcodebuild -version; xcrun swift --version; } | tee qualification/toolchain.txt
          bash scripts/build-switch2kit.sh 2>&1 | tee qualification/build.log
      - name: Check extracted bundle, permissions, signing and isolated loader
        run: python tests/switch2kit/qualify-package.py
      - name: Preserve diagnostics (not a release package)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cemu-native-${{ (inputs.platform || 'linux-x64') }}
          path: |
            qualification/
            build-switch2kit/CMakeCache.txt
            build-switch2kit/CMakeFiles/CMakeConfigureLog.yaml
            build-switch2kit/vcpkg-manifest-install.log
          if-no-files-found: warn
          retention-days: 3
  windows:
    if: (inputs.platform || 'linux-x64') == 'windows-x64'
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0c592f77c884d86c9c4b4f83e1a00c25a2186ac1
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - name: Install pinned build tools
        run: |
          python -m pip install cmake==3.31.6 ninja==1.11.1.3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build with compatible VS2022 and exact Swift compiler paths
        run: |
          New-Item -ItemType Directory -Force qualification | Out-Null
          swift --version | Tee-Object qualification/toolchain.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/build-switch2kit.ps1 2>&1 | Tee-Object qualification/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check extracted application and isolated loader
        run: |
          python tests/switch2kit/qualify-package.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve diagnostics (not a release package)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cemu-native-${{ (inputs.platform || 'linux-x64') }}
          path: |
            qualification/
            build-switch2kit-windows/CMakeCache.txt
            build-switch2kit-windows/CMakeFiles/CMakeConfigureLog.yaml
            build-switch2kit-windows/vcpkg-manifest-install.log
          if-no-files-found: warn
          retention-days: 3
