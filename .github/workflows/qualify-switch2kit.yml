name: Qualify candidate SDK on Windows
# Temporary qualification branch only. Do not merge this trigger.
on:
  push:
    branches: [qualification/cemu-native-windows]
    paths: [.github/workflows/qualify-switch2kit.yml]
permissions:
  contents: read
concurrency:
  group: candidate-sdk-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-sdk:
    runs-on: windows-2022
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jmonster/Switch2Kit
          ref: 77ee4fa3cac849106f571ccfec6c5e582b7c0dd2
          persist-credentials: false
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6
        with:
          swift-version: swift-6.2.1-release
          swift-build: 6.2.1-RELEASE
      - name: Verify exact source and baseline toolchain
        run: |
          $ErrorActionPreference = 'Stop'
          $head = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -ne '77ee4fa3cac849106f571ccfec6c5e582b7c0dd2') { throw 'Unexpected SDK revision' }
          Write-Output "SDK revision: $head"
          $version = swift --version
          if ($LASTEXITCODE -ne 0) { throw 'Could not query Swift version' }
          Write-Output $version
          if (($version -join "`n") -notmatch 'Swift version 6\.2\.1(?:[ (]|$)') { throw 'Expected baseline Swift 6.2.1' }
      - name: Execute SDK package tests and build release facade
        run: |
          $ErrorActionPreference = 'Stop'
          swift test --jobs 3 -Xswiftc -warnings-as-errors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          swift build --jobs 3 -c release --product Switch2KitC
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
